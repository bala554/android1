name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone plugin-builder
        run: |
          git clone https://github.com/<owner>/plugin-builder.git plugin-builder

      - name: Ensure plugin-builder is available
        run: |
          set -e
          echo "Repo root contents:"
          ls -la
          mkdir -p android1/plugin-api
          if [ -d "plugin-api/plugin-builder" ]; then
            cp -r plugin-api/plugin-builder android1/plugin-api/
          elif [ -d "plugin-builder" ]; then
            mkdir -p android1/plugin-api/plugin-builder
            cp -r plugin-builder/* android1/plugin-api/plugin-builder/
          else
            echo "plugin-builder not found in repo; attempting to clone..."
            git clone https://github.com/<owner>/plugin-builder.git plugin-builder \
              && mkdir -p android1/plugin-api/plugin-builder \
              && cp -r plugin-builder/* android1/plugin-api/plugin-builder/ \
              || { echo "Failed to obtain plugin-builder. Check submodule settings or repository contents."; exit 1; }
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Create missing assets directories
        run: mkdir -p android1/CodeOnTheGo-stage/assets/release/v7 android1/CodeOnTheGo-stage/assets/release/v8

      - name: Make Gradle Wrapper Executable
        run: chmod +x android1/CodeOnTheGo-stage/gradlew

      - name: Generate Dummy Debug Keystore
        run: |
          mkdir -p android1/CodeOnTheGo-stage
          keytool -genkey -v \
            -keystore android1/CodeOnTheGo-stage/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        working-directory: ./android1/CodeOnTheGo-stage
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "my-android-app"
          path: "android1/CodeOnTheGo-stage/app/build/outputs/apk/debug/*.apk"
